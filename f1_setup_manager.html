<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 25 Setup Manager - 2026 Season</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #c1121f 0%, #800000 100%);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: #2a2a3e;
            border: 2px solid #c1121f;
            color: #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
        }

        .search-box input::placeholder {
            color: #888;
        }

        .search-box input:focus {
            outline: none;
            border-color: #ff1744;
            box-shadow: 0 0 10px rgba(193, 18, 31, 0.5);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #2a2a3e;
            border: 2px solid #c1121f;
            color: #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(193, 18, 31, 0.3);
        }

        button.active {
            background: #ff1744;
            border-color: #ff1744;
        }

        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .track-card {
            background: #2a2a3e;
            border: 2px solid #404050;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .track-card:hover {
            border-color: #c1121f;
            box-shadow: 0 4px 12px rgba(193, 18, 31, 0.3);
            transform: translateY(-4px);
        }

        .track-card.active {
            border-color: #ff1744;
            background: #3a3a4e;
        }

        .track-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ff1744;
        }

        .setup-count {
            font-size: 0.9em;
            color: #888;
        }

        .setup-count strong {
            color: #c1121f;
        }

        .details-panel {
            background: #2a2a3e;
            border: 2px solid #c1121f;
            border-radius: 8px;
            padding: 25px;
            display: none;
        }

        .details-panel.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-header {
            font-size: 1.8em;
            color: #ff1744;
            margin-bottom: 20px;
            border-bottom: 2px solid #c1121f;
            padding-bottom: 10px;
        }

        .setups-list {
            margin-bottom: 20px;
        }

        .setup-item {
            background: #1a1a2e;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #c1121f;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .setup-item:hover {
            background: #252540;
            border-left-color: #ff1744;
        }

        .setup-item.selected {
            background: #3a3a4e;
            border-left-color: #ff1744;
        }

        .setup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .setup-name {
            font-weight: bold;
            color: #ff1744;
        }

        .setup-creator {
            font-size: 0.9em;
            color: #888;
        }

        .setup-team {
            font-size: 0.85em;
            padding: 3px 8px;
            background: #404050;
            border-radius: 3px;
            color: #b0b0c0;
        }

        .setup-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 12px;
            font-size: 0.9em;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #404050;
            padding-bottom: 5px;
        }

        .meta-label {
            color: #888;
            font-weight: 600;
        }

        .meta-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        .setup-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #404050;
        }

        .setup-item.selected .setup-details {
            display: block;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-section {
            background: #2a2a3e;
            padding: 12px;
            border-radius: 5px;
            border-left: 3px solid #c1121f;
        }

        .detail-section-title {
            font-weight: bold;
            color: #ff1744;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85em;
            border-bottom: 1px solid #404050;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #888;
        }

        .detail-value {
            color: #e0e0e0;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .add-setup-button {
            background: linear-gradient(135deg, #c1121f 0%, #800000 100%);
            margin-top: 20px;
            font-weight: bold;
        }

        .add-setup-button:hover {
            background: linear-gradient(135deg, #ff1744 0%, #c1121f 100%);
        }

        .conditions-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 5px;
            font-weight: 600;
        }

        .conditions-badge.dry {
            background: #ffb700;
            color: #000;
        }

        .conditions-badge.wet {
            background: #2196f3;
            color: #fff;
        }

        .no-data {
            color: #888;
            font-style: italic;
            padding: 10px 0;
        }

        footer {
            text-align: center;
            color: #666;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #404050;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏁 F1 25 Setup Manager</h1>
            <p class="subtitle">2026 Season - Organize & Quick Reference Your Favorite Setups</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search tracks or setups...">
            </div>
            <div class="filter-buttons">
                <button id="filterDry" class="active">🏜️ Dry</button>
                <button id="filterWet">💧 Wet</button>
                <button id="filterAll" class="active">All Conditions</button>
            </div>
        </div>

        <div class="tracks-grid" id="tracksGrid">
            <!-- Tracks will be generated here -->
        </div>

        <div class="details-panel" id="detailsPanel">
            <div class="panel-header" id="panelTitle">Select a Track</div>
            <div id="setupsContainer">
                <div class="empty-state">
                    <p>Select a track to view available setups</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Data sourced from F1 Laps • Last updated: Now</p>
            <p style="font-size: 0.8em; margin-top: 10px; color: #555;">💡 Tip: Open this in a second window while playing for quick reference</p>
        </footer>
    </div>

    <script>
        // F1 25 2026 Season Tracks
        const tracks = [
            { name: "Australia", location: "Melbourne", flag: "🇦🇺" },
            { name: "China", location: "Shanghai", flag: "🇨🇳" },
            { name: "Japan", location: "Suzuka", flag: "🇯🇵" },
            { name: "Bahrain", location: "Sakhir", flag: "🇧🇭" },
            { name: "Saudi Arabia", location: "Jeddah", flag: "🇸🇦" },
            { name: "Miami", location: "Miami", flag: "🇺🇸" },
            { name: "Imola", location: "Bologna", flag: "🇮🇹" },
            { name: "Monaco", location: "Monte Carlo", flag: "🇲🇨" },
            { name: "Spain", location: "Barcelona", flag: "🇪🇸" },
            { name: "Canada", location: "Montreal", flag: "🇨🇦" },
            { name: "Austria", location: "Spielberg", flag: "🇦🇹" },
            { name: "Silverstone", location: "Northampton", flag: "🇬🇧" },
            { name: "Belgium", location: "Spa", flag: "🇧🇪" },
            { name: "Hungary", location: "Budapest", flag: "🇭🇺" },
            { name: "Netherlands", location: "Zandvoort", flag: "🇳🇱" },
            { name: "Italy", location: "Monza", flag: "🇮🇹" },
            { name: "Azerbaijan", location: "Baku", flag: "🇦🇿" },
            { name: "Singapore", location: "Marina Bay", flag: "🇸🇬" },
            { name: "Austin", location: "Texas", flag: "🇺🇸" },
            { name: "Mexico", location: "Mexico City", flag: "🇲🇽" },
            { name: "Brazil", location: "Sao Paulo", flag: "🇧🇷" },
            { name: "Las Vegas", location: "Nevada", flag: "🇺🇸" },
            { name: "Qatar", location: "Lusail", flag: "🇶🇦" },
            { name: "Abu Dhabi", location: "Yas Island", flag: "🇦🇪" }
        ];

        // Sample setup data structure (will be populated from F1 Laps)
        const setupsDatabase = {
            "Australia": [
                {
                    id: "australia_1",
                    name: "Australia Setup",
                    creator: "leoncon99",
                    team: "Aston Martin",
                    lapTime: "1:15.974",
                    conditions: "dry",
                    aerodynamics: {
                        front: 23,
                        rear: 10
                    },
                    transmission: {
                        diffOn: 100,
                        diffOff: 25
                    },
                    suspension: {
                        frontCamber: -3.50,
                        rearCamber: -2.00,
                        frontToe: 0.00,
                        rearToe: 0.10,
                        frontSuspension: 41,
                        rearSuspension: 1,
                        frontARB: 8,
                        rearARB: 16,
                        frontRideHeight: 20,
                        rearRideHeight: 40
                    },
                    brakes: {
                        pressure: 100,
                        frontBias: 52
                    },
                    tires: {
                        frontLeftPressure: 29.5,
                        frontRightPressure: 29.5,
                        rearLeftPressure: 20.5,
                        rearRightPressure: 20.5
                    }
                }
            ]
        };

        // Initialize the app
        function init() {
            renderTracks();
            setupEventListeners();
        }

        function renderTracks() {
            const tracksGrid = document.getElementById('tracksGrid');
            tracksGrid.innerHTML = tracks.map((track, index) => `
                <div class="track-card" data-track="${track.name}">
                    <div class="track-name">${track.flag} ${track.name}</div>
                    <div class="setup-count">
                        <strong>${setupsDatabase[track.name]?.length || 0}</strong> setup${setupsDatabase[track.name]?.length !== 1 ? 's' : ''}
                    </div>
                    <div class="no-data" style="font-size: 0.85em; margin-top: 8px;">📍 ${track.location}</div>
                </div>
            `).join('');

            document.querySelectorAll('.track-card').forEach(card => {
                card.addEventListener('click', () => selectTrack(card.dataset.track));
            });
        }

        function selectTrack(trackName) {
            // Update active card
            document.querySelectorAll('.track-card').forEach(card => {
                card.classList.remove('active');
                if (card.dataset.track === trackName) {
                    card.classList.add('active');
                }
            });

            // Update panel
            document.getElementById('panelTitle').textContent = `📍 ${trackName} Setups`;
            renderSetups(trackName);
            document.getElementById('detailsPanel').classList.add('active');
        }

        function renderSetups(trackName) {
            const container = document.getElementById('setupsContainer');
            const setups = setupsDatabase[trackName] || [];

            if (setups.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No setups saved for ${trackName} yet</p>
                        <p style="font-size: 0.9em; margin-top: 15px; color: #666;">
                            Find great setups on <strong>f1laps.com</strong> and add them here!
                        </p>
                        <button class="add-setup-button" onclick="addNewSetup('${trackName}')">
                            ➕ Add Setup from F1 Laps
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = setups.map((setup, index) => `
                <div class="setup-item" data-setup-id="${setup.id}" onclick="toggleSetupDetails(event, '${setup.id}')">
                    <div class="setup-header">
                        <div>
                            <div class="setup-name">${setup.name}
                                <span class="conditions-badge ${setup.conditions}">${setup.conditions.toUpperCase()}</span>
                            </div>
                            <div class="setup-creator">by ${setup.creator}</div>
                        </div>
                        <div class="setup-team">${setup.team}</div>
                    </div>

                    <div class="setup-meta">
                        <div class="meta-item">
                            <span class="meta-label">Lap Time:</span>
                            <span class="meta-value">${setup.lapTime}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Front Wing:</span>
                            <span class="meta-value">${setup.aerodynamics.front}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Rear Wing:</span>
                            <span class="meta-value">${setup.aerodynamics.rear}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Brake Bias:</span>
                            <span class="meta-value">${setup.brakes.frontBias}%</span>
                        </div>
                    </div>

                    <div class="setup-details">
                        <div class="details-grid">
                            <div class="detail-section">
                                <div class="detail-section-title">🪫 Suspension</div>
                                <div class="detail-row">
                                    <span class="detail-label">Front:</span>
                                    <span class="detail-value">${setup.suspension.frontSuspension}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Rear:</span>
                                    <span class="detail-value">${setup.suspension.rearSuspension}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Front ARB:</span>
                                    <span class="detail-value">${setup.suspension.frontARB}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Rear ARB:</span>
                                    <span class="detail-value">${setup.suspension.rearARB}</span>
                                </div>
                            </div>

                            <div class="detail-section">
                                <div class="detail-section-title">🛞 Tires</div>
                                <div class="detail-row">
                                    <span class="detail-label">FL Pressure:</span>
                                    <span class="detail-value">${setup.tires.frontLeftPressure}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">FR Pressure:</span>
                                    <span class="detail-value">${setup.tires.frontRightPressure}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">RL Pressure:</span>
                                    <span class="detail-value">${setup.tires.rearLeftPressure}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">RR Pressure:</span>
                                    <span class="detail-value">${setup.tires.rearRightPressure}</span>
                                </div>
                            </div>

                            <div class="detail-section">
                                <div class="detail-section-title">🔧 More Details</div>
                                <div class="detail-row">
                                    <span class="detail-label">Front Camber:</span>
                                    <span class="detail-value">${setup.suspension.frontCamber}°</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Rear Camber:</span>
                                    <span class="detail-value">${setup.suspension.rearCamber}°</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Brake Pressure:</span>
                                    <span class="detail-value">${setup.brakes.pressure}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Diff On/Off:</span>
                                    <span class="detail-value">${setup.transmission.diffOn}/${setup.transmission.diffOff}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Add button to add more setups
            const addButton = document.createElement('button');
            addButton.className = 'add-setup-button';
            addButton.textContent = '➕ Add Another Setup';
            addButton.onclick = () => addNewSetup(trackName);
            container.appendChild(addButton);
        }

        function toggleSetupDetails(event, setupId) {
            const setupItem = event.currentTarget;
            document.querySelectorAll('.setup-item').forEach(item => {
                if (item !== setupItem) item.classList.remove('selected');
            });
            setupItem.classList.toggle('selected');
        }

        function addNewSetup(trackName) {
            alert(`To add a new setup for ${trackName}:\n\n1. Go to https://www.f1laps.com/f1-25/setups/${trackName.toLowerCase().replace(' ', '-')}/\n2. Find a setup you like\n3. Copy the setup details\n4. Use your browser console to add it to the database\n\nOr save the setup data in F1 25 and we can document it here!`);
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.track-card').forEach(card => {
                    const trackName = card.dataset.track.toLowerCase();
                    const location = card.querySelector('.no-data').textContent.toLowerCase();
                    card.style.display = trackName.includes(query) || location.includes(query) ? '' : 'none';
                });
            });

            document.getElementById('filterDry').addEventListener('click', function() {
                this.classList.toggle('active');
            });

            document.getElementById('filterWet').addEventListener('click', function() {
                this.classList.toggle('active');
            });

            document.getElementById('filterAll').addEventListener('click', function() {
                if (!this.classList.contains('active')) {
                    document.getElementById('filterDry').classList.add('active');
                    document.getElementById('filterWet').classList.add('active');
                    this.classList.add('active');
                }
            });
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
